services:
  ollama:
    image: ollama/ollama:latest
    container_name: heimdall-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: heimdall-server
    restart: unless-stopped
    depends_on:
      - ollama
    volumes:
      - /var/log:/host/var/log:ro
      - /mnt/Minecraft/mc_server/servers/4809472d-3369-4c49-bf8c-8a4e6e3e1bb0/logs:/host/minecraft-logs:ro
      - heimdall-data:/app/data
    environment:
      - HEIMDALL_LOG_DIR=/host/var/log
      - HEIMDALL_DB_PATH=/app/data/heimdall.db
      - HEIMDALL_SPOOL_DIR=/app/data/spool
      - HEIMDALL_OLLAMA_URL=http://ollama:11434
      - HEIMDALL_LLM_MODEL=qwen2.5:0.5b
      - HEIMDALL_REPORT_INTERVAL=1h
      - HEIMDALL_INTERNAL_ADDR=:9090
      - HEIMDALL_INTERNAL_TOKEN=${HEIMDALL_INTERNAL_TOKEN}
    # no ports published - only the controller talks to this, over the
    # internal compose network by container name

  controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
    container_name: heimdall-ui
    restart: unless-stopped
    depends_on:
      - worker
    ports:
      - "8080:8080"
    volumes:
      - heimdall-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - HEIMDALL_DB_PATH=/app/data/heimdall.db
      - HEIMDALL_AUTH_USER=${HEIMDALL_AUTH_USER:-admin}
      - HEIMDALL_AUTH_PASS=${HEIMDALL_AUTH_PASS}
      - HEIMDALL_CONTROLLER_CONTAINER=heimdall-ui
      - HEIMDALL_WORKER_CONTAINER=heimdall-server
      - HEIMDALL_WORKER_URL=http://heimdall-server:9090
      - HEIMDALL_CONTROLLABLE_CONTAINERS=heimdall-ui,heimdall-server,heimdall-ollama
      - HEIMDALL_INTERNAL_TOKEN=${HEIMDALL_INTERNAL_TOKEN}
      - HEIMDALL_SESSION_TIMEOUT=30m
      - HEIMDALL_ACTIVITY_RETENTION=48h

volumes:
  ollama-data:
  heimdall-data: